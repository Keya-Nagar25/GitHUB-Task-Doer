[project]
name = "github-taskdoer-backend"
version = "0.1.0"
description = "Backend for GitHub Task Doer: English -> Git/GitHub actions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "sentence-transformers>=3.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "anthropic>=0.39",
    "authlib>=1.3",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
